<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">TURNO</title>
  <desc id="d">Reloj con una franja horaria que se llena. Texto: Pedi antes. Llega y retira.</desc>
  <rect width="1200" height="320" rx="24" fill="#F7F4EE"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#E3D9C8" stroke-width="2"/>

  <!-- Reloj -->
  <g transform="translate(250 160)">
    <circle r="104" fill="#34483C"/>
    <circle r="92" fill="#F7F4EE"/>
    <!-- Franja reservada: arco dorado que se dibuja -->
    <circle r="78" fill="none" stroke="#E3D9C8" stroke-width="14"/>
    <circle r="78" fill="none" stroke="#B68D59" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="0 490" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="0 490;196 294;196 294;0 490" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Marcas -->
    <g stroke="#252521" stroke-width="4" stroke-linecap="round">
      <line y1="-62" y2="-52"/><line y1="62" y2="52"/><line x1="-62" x2="-52"/><line x1="62" x2="52"/>
    </g>
    <!-- Manecilla -->
    <g>
      <line y2="-56" stroke="#34483C" stroke-width="6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0;144;144;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#252521"/>
  </g>

  <!-- Texto -->
  <text x="430" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="6" fill="#252521">TURNO</text>
  <text x="434" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#34483C">Pedí antes. Llegá y retirá.</text>

  <!-- Franjas -->
  <g transform="translate(434 226)">
    <rect width="96" height="14" rx="7" fill="#E3D9C8"/>
    <rect width="96" height="14" rx="7" fill="#34483C">
      <animate attributeName="width" values="12;96;96;12" keyTimes="0;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" width="96" height="14" rx="7" fill="#E3D9C8"/>
    <rect x="112" width="96" height="14" rx="7" fill="#34483C">
      <animate attributeName="width" values="12;62;62;12" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="224" width="96" height="14" rx="7" fill="#E3D9C8"/>
    <rect x="224" width="96" height="14" rx="7" fill="#34483C">
      <animate attributeName="width" values="12;30;30;12" keyTimes="0;0.6;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="434" y="276" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#252521">Reserva capacidad de cocina por franja horaria.</text>
</svg>
